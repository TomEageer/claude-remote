<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: https: file:; media-src 'self' file: blob:; frame-src crplugin: crpage:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Claude 远程助手</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>Claude 远程助手</span>
        </div>
        <button id="btn-new" class="new-chat">
          <span class="ico" data-ico="plus"></span>新对话
        </button>
        <div class="search">
          <span class="ico" data-ico="search"></span>
          <input id="search" placeholder="搜索对话" />
        </div>
        <button id="btn-history" class="side-link"><span class="ico" data-ico="history"></span>服务器上的会话</button>
      </div>
      <div id="tree" class="tree"></div>
      <div class="side-bottom">
        <button id="btn-new-group" class="side-btn"><span class="ico" data-ico="folderPlus"></span>新建分组</button>
        <button id="btn-files" class="side-btn"><span class="ico" data-ico="folder"></span>服务器文件</button>
        <button id="btn-settings-side" class="side-btn" title="设置：连接、网络、MCP · Skill · 拓展功能、通知、远程控制、用量统计"><span class="ico" data-ico="gear"></span>设置<span id="ver-link" class="side-sub ver-link" title="点击检查更新"></span></button>
        <div id="update-bar" class="update-bar hidden"></div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar" class="chat-part">
        <div id="title" class="title"></div>
        <button id="pending-chip" class="pending-chip hidden"></button>
        <div class="top-right">
          <button id="cwd-chip" class="cwd-chip"></button>
          <button id="btn-filepane" class="model-btn" title="打开这个对话文件夹的文件面板"><span class="ico" data-ico="folder"></span><span>文件</span></button>
        </div>
      </header>
      <section id="scroller" class="chat-part">
        <div id="messages"></div>
        <div id="empty" class="empty">
          <div class="empty-mark" aria-hidden="true"></div>
          <h1 id="greeting">有什么可以帮你？</h1>
          <p class="empty-sub">把文件直接拖到下面的输入框，就会传到服务器上让 Claude 查看</p>
        </div>
      </section>
      <footer id="composer-wrap" class="chat-part">
        <div id="composer" class="composer">
          <div id="attachments" class="attachments"></div>
          <textarea id="input" rows="1" placeholder="给 Claude 发消息，Enter 发送，Shift+Enter 换行，输入 / 查看命令"></textarea>
          <div class="composer-bar">
            <button id="btn-attach" class="icon-btn" title="添加文件"><span class="ico" data-ico="clip"></span></button>
            <button id="btn-model" class="model-btn" title="切换模型"><span id="model-name"></span><span class="ico" data-ico="chevDown"></span></button>
            <button id="btn-caps" class="model-btn" title="这个对话可以用的 MCP 和 Skill"><span class="ico" data-ico="plug"></span><span>能力</span></button>
            <button id="btn-plan" class="model-btn toggle" title="计划模式：Claude 先调研、写方案，你批准后才动手（/plan）"><span class="ico" data-ico="list"></span><span>计划</span></button>
            <button id="btn-btw" class="model-btn toggle" title="旁问：带着对话上下文插问一句，不进入对话、不打断 Claude（/btw）"><span class="ico" data-ico="chat"></span><span>旁问</span></button>
            <button id="btn-tasks" class="model-btn tasks-btn hidden" title="后台运行的命令和派出的助手"><span class="ico" data-ico="terminal"></span><span class="tk-label">后台任务</span></button>
            <div class="spacer"></div>
            <span id="run-timer" class="run-timer hidden"></span>
            <span id="ctx-meter" class="ctx-meter no-data"><span class="ring"></span><span class="ctx-text">上下文 —</span></span>
            <span class="send-slot">
              <button id="btn-send" class="send" title="发送"><span class="ico" data-ico="arrowUp"></span></button>
              <button id="btn-stop" class="send stop hidden" title="停止（Esc）"><span class="ico" data-ico="stop"></span></button>
            </span>
          </div>
          <div class="run-strip" aria-hidden="true"><i></i></div>
        </div>
      </footer>
      <section id="view-files" class="view"></section>
      <section id="view-plugins" class="view"></section>
      <section id="view-caps" class="view"></section>
      <section id="view-history" class="view"></section>
      <div id="timeline" class="timeline chat-part"></div>
      <footer id="statusbar" class="statusbar">
        <span class="sb-right">
          <span id="conn" class="conn" title=""><span class="dot"></span><span class="conn-text">未连接</span></span>
          <button id="server-switch" class="server-switch"></button>
          <button id="usage-box" class="usage-box" title="点击查看额度明细"></button>
        </span>
      </footer>
      <div id="drop" class="drop hidden">
        <div class="drop-box">
          <span class="ico big" data-ico="upload"></span>
          <div>松开鼠标，上传到服务器</div>
        </div>
      </div>
    </main>
    <!-- 右侧面板：文件和预览。只开一个时没有标签栏，开了多个时像浏览器一样用标签切换 -->
    <div id="dock" class="dock hidden">
      <div class="dock-resizer"></div>
      <div id="dock-tabs" class="dock-tabs hidden"></div>
      <div class="dock-panels">
        <aside id="filepane" class="filepane hidden"></aside>
        <aside id="preview" class="preview hidden"></aside>
      </div>
    </div>
  </div>

  <div id="menu" class="menu hidden"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="icons.js"></script>
  <script src="colresize.js"></script>
  <script src="app.js"></script>
  <script src="preview.js"></script>
  <script src="files.js"></script>
  <script src="cwd.js"></script>
  <script src="dock.js"></script>
  <script src="modelpicker.js"></script>
  <script src="plugins-ui.js"></script>
  <script src="caps.js"></script>
  <script src="history-ui.js"></script>
  <script src="timeline.js"></script>
  <script src="slash.js"></script>
  <script src="servers.js"></script>
  <script src="usage.js"></script>
  <script src="stats.js"></script>
  <script src="notify-ui.js"></script>
  <script src="side.js"></script>
  <script src="vpn-ui.js"></script>
  <script src="tasks.js"></script>
  <script src="tour.js"></script>
  <script src="find.js"></script>
  <script src="diff.js"></script>
  <script src="ask.js"></script>
  <script src="quick-ui.js"></script>
  <script src="vendor/nacl-fast.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="e2e.js"></script>
  <script src="remote.js"></script>
</body>
</html>
