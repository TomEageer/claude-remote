# XcodeGen 工程定义：`xcodegen generate` 生成 ClaudeRemoteWatch.xcodeproj（工程文件不入库）
# 独立的 watchOS App（不需要 iPhone 端 App），直接连中转。
name: ClaudeRemoteWatch
options:
  bundleIdPrefix: io.claude-remote
  deploymentTarget:
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  ClaudeRemoteCore:
    path: ../ClaudeRemoteCore
targets:
  ClaudeRemoteWatch:
    type: application
    platform: watchOS
    sources: [Sources, Assets.xcassets]
    dependencies:
      - package: ClaudeRemoteCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Claude 远程
        CFBundleName: Claude 远程
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # 只放行本机地址（模拟器连本机测试中转用），公网仍然必须 HTTPS
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.claude-remote.watch
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
        SWIFT_STRICT_CONCURRENCY: minimal
