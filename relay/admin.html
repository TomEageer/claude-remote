<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>中转看板</title>
<style>
  :root {
    color-scheme: light;
    --bg: #faf9f5; --surface: #ffffff; --line: #e6e2d8; --grid: #efece4;
    --text: #1f1e1d; --text-2: #5e5d59; --text-3: #8f8b82;
    --accent: #c96442; --soft: #f3f1ea;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #262624; --surface: #30302e; --line: #3a3936; --grid: #383835;
      --text: #f0efea; --text-2: #c2c0b6; --text-3: #8f8c84;
      --accent: #d97757; --soft: #2b2a28;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--font); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .sub { color: var(--text-3); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .tile .k { font-size: 12.5px; color: var(--text-2); }
  .tile .v { font-size: 24px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .tile .n { font-size: 12px; color: var(--text-3); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14.5px; margin: 0 0 4px; font-weight: 600; }
  .card .hint { font-size: 12.5px; color: var(--text-3); margin-bottom: 10px; }
  .legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart .ax { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .gl { stroke: var(--grid); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hov { fill: var(--text); opacity: .05; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 8px 10px; font-size: 12.5px; min-width: 170px; font-variant-numeric: tabular-nums; }
  .tip b { display: block; margin-bottom: 3px; }
  .tip div { display: flex; justify-content: space-between; gap: 14px; color: var(--text-2); }
  .tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  details { margin-top: 10px; font-size: 12.5px; color: var(--text-2); }
  summary { cursor: pointer; color: var(--text-3); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-3); padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.r, th.r { text-align: right; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--text-3); opacity: .5; }
  .dot.on { background: #4f8a5b; opacity: 1; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 8px; background: var(--soft); color: var(--text-2); margin-left: 6px; }
  .tag.lim { color: var(--accent); }
  .muted { color: var(--text-3); }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--text-3); }
  .login { max-width: 380px; margin: 14vh auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .login input { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--bg); color: var(--text); font: inherit; margin: 12px 0; }
  .login button { height: 36px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  .err { color: #b3412f; font-size: 12.5px; min-height: 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="login hidden" id="login">
  <h1>中转看板</h1>
  <div class="sub">在服务器上运行 <span class="mono">crrelay admin</span>，打开它给的链接，或者把 # 后面的密钥粘贴到这里</div>
  <input id="key" type="password" placeholder="管理密钥" autocomplete="off" />
  <div class="err" id="err"></div>
  <button id="go">打开</button>
</div>
<div class="wrap hidden" id="app">
  <header><h1>中转看板</h1><span class="sub" id="meta"></span></header>
  <div class="tiles" id="tiles"></div>
  <div class="card">
    <h2>最近 30 天每天的流量</h2>
    <div class="hint">按访问令牌分颜色；流量都是「手机↔服务器」和「服务器↔电脑」两段合计</div>
    <div class="legend" id="legend"></div>
    <div class="chart" id="chart"><svg id="svg" role="img" aria-label="最近 30 天每天的流量"></svg><div class="tip hidden" id="tip"></div></div>
    <details><summary>看数字</summary><table id="daytable"></table></details>
  </div>
  <div class="card">
    <h2>访问令牌</h2>
    <div class="hint">限速按每台电脑算；本月流量是这个令牌下所有电脑和它们的手机加起来</div>
    <table id="tokens"></table>
  </div>
  <div class="card">
    <h2>电脑</h2>
    <div class="hint">名字是对方电脑上「远程控制」里填的名字（旧版本的电脑没有名字，显示编号）；看不到任何对话内容</div>
    <table id="hosts"></table>
  </div>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtB(n) {
  n = Number(n) || 0;
  if (n >= 1 << 30) return (n / (1 << 30)).toFixed(n >= 10 * (1 << 30) ? 1 : 2) + ' GB';
  if (n >= 1 << 20) return (n / (1 << 20)).toFixed(1) + ' MB';
  if (n >= 1 << 10) return (n / (1 << 10)).toFixed(0) + ' KB';
  return n + ' B';
}
const fmtR = (n) => fmtB(n) + '/s';
function ago(ms) {
  if (!ms) return '';
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return m + ' 分钟前';
  if (m < 1440) return Math.round(m / 60) + ' 小时前';
  return Math.round(m / 1440) + ' 天前';
}

// 密钥：链接 # 后面带来的先存起来，再从地址栏去掉
let key = localStorage.getItem('crrelay-admin') || '';
const hm = /[#&]k=([0-9a-f]{16,})/i.exec(location.hash);
if (hm) { key = hm[1]; localStorage.setItem('crrelay-admin', key); history.replaceState(null, '', location.pathname); }

function showLogin(msg) {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#err').textContent = msg || '';
}
$('#go').onclick = () => { key = $('#key').value.trim(); localStorage.setItem('crrelay-admin', key); load(); };
$('#key').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };

let timer = 0;
async function load() {
  clearTimeout(timer);
  if (!key) return showLogin();
  let r;
  try { r = await fetch('/admin/api', { headers: { Authorization: 'Bearer ' + key }, cache: 'no-store' }); } catch (_) { timer = setTimeout(load, 5000); return; }
  if (r.status === 401) { localStorage.removeItem('crrelay-admin'); return showLogin('密钥不对，或者已经在服务器上换过了'); }
  if (!r.ok) { timer = setTimeout(load, 5000); return; }
  const d = await r.json();
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  render(d);
  timer = setTimeout(load, 5000);
}

const X2 = (n) => (Number(n) || 0) * 2; // 中转收进来再发出去：两段合计
function render(d) {
  const t = new Date(d.now);
  $('#meta').textContent = `中转程序 ${d.version} · 每 5 秒刷新 · ${t.toLocaleTimeString('zh-CN', { hour12: false })}`;
  const onH = d.hosts.filter((h) => h.online);
  const phones = onH.reduce((a, h) => a + h.phones, 0);
  const todayRow = d.days[d.days.length - 1] || { tokens: {} };
  const today = Object.values(todayRow.tokens).reduce((a, v) => a + v, 0);
  const limited = onH.filter((h) => h.limited).length;
  const tiles = [
    ['本月流量', fmtB(X2(d.relay.month)), `${d.month.replace('-', ' 年 ')} 月 · 手机↔服务器↔电脑两段合计`],
    ['今天', fmtB(X2(today)), '从 0 点算起'],
    ['此刻转发速度', fmtR(d.relay.rate), limited ? `${limited} 台电脑正在被限速（限速也按转发速度算）` : '没有电脑在被限速'],
    ['在线', `${onH.length} 台电脑`, `${phones} 台手机连着 · 一共见过 ${d.hosts.length} 台电脑`],
  ];
  $('#tiles').innerHTML = tiles.map(([k, v, n]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="n">${esc(n)}</div></div>`).join('');
  // 颜色跟着令牌走（按令牌表里的顺序），不跟着用量排名变
  const names = d.tokens.map((k) => k.name);
  d.days.forEach((x) => Object.keys(x.tokens).forEach((k) => { if (!names.includes(k)) names.push(k); }));
  const color = (k) => `var(--s${(names.indexOf(k) % 8) + 1})`;
  const used = names.filter((k) => d.days.some((x) => x.tokens[k]));
  $('#legend').innerHTML = (used.length ? used : names).map((k) => `<span><i style="background:${color(k)}"></i>${esc(k)}</span>`).join('');
  chart(d.days, used, color);
  $('#daytable').innerHTML = `<tr><th>日期</th>${used.map((k) => `<th class="r">${esc(k)}</th>`).join('')}<th class="r">合计</th></tr>` +
    d.days.slice().reverse().filter((x) => Object.keys(x.tokens).length).map((x) => `<tr><td>${x.date}</td>${used.map((k) => `<td class="r">${fmtB(X2(x.tokens[k]))}</td>`).join('')}<td class="r">${fmtB(X2(Object.values(x.tokens).reduce((a, v) => a + v, 0)))}</td></tr>`).join('');
  $('#tokens').innerHTML = '<tr><th>名字</th><th>限速</th><th class="r">在线电脑</th><th class="r">本月流量</th></tr>' +
    d.tokens.map((k) => `<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;background:${color(k.name)}"></i>${esc(k.name)}</td><td>${k.rate > 0 ? fmtR(k.rate) + ' / 每台' : '<span class="muted">不限</span>'}</td><td class="r">${k.online} / ${k.hosts}</td><td class="r">${fmtB(X2(k.month))}</td></tr>`).join('');
  $('#hosts').innerHTML = '<tr><th>电脑</th><th>令牌</th><th>状态</th><th class="r">此刻转发速度</th><th class="r">本月流量</th></tr>' +
    (d.hosts.length ? d.hosts.map((h) => `<tr>
      <td>${h.name ? esc(h.name) : `<span class="mono">${esc(h.id.slice(0, 10))}</span>`}</td>
      <td>${esc(h.tok)}</td>
      <td><span class="dot${h.online ? ' on' : ''}"></span>${h.online ? `在线${h.phones ? ` · ${h.phones} 台手机` : ''}` : `<span class="muted">离线 · ${ago(h.seen)}</span>`}</td>
      <td class="r">${h.online ? fmtR(h.speed) : '<span class="muted">—</span>'}${h.limited ? '<span class="tag lim">限速中</span>' : ''}</td>
      <td class="r">${fmtB(X2(h.month))}</td></tr>`).join('') : '<tr><td colspan="5" class="muted">还没有电脑连上来</td></tr>');
}

// 堆叠柱：每个令牌一段，段之间留 2px 缝，最上面一段顶端圆角；悬停显示当天每个令牌的数字
function chart(days, keys, color) {
  const svg = $('#svg');
  const W = svg.clientWidth || 900, H = 220, L = 52, B = 22, T = 8;
  const rows = days.map((x) => ({ date: x.date, parts: keys.map((k) => X2(x.tokens[k])), total: X2(Object.values(x.tokens).reduce((a, v) => a + v, 0)) }));
  const max = Math.max(1, ...rows.map((r) => r.total));
  const unit = max >= 1 << 30 ? 1 << 30 : max >= 1 << 20 ? 1 << 20 : 1 << 10;
  const steps = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
  const raw = max / unit / 4;
  const step = (steps.find((s) => s >= raw) || raw) * unit;
  const top = Math.ceil(max / step) * step;
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const bw = (W - L) / rows.length;
  const gap = Math.min(6, bw * 0.3);
  const uname = unit === 1 << 30 ? ' GB' : unit === 1 << 20 ? ' MB' : ' KB';
  let s = '';
  for (let v = 0; v <= top + 1; v += step) s += `<line class="gl" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v === 0 ? '0' : +(v / unit).toFixed(1) + uname}</text>`;
  const bar = (x, y0, y1, fill, roundTop) => {
    const h = y0 - y1;
    if (h < 0.5) return '';
    const w = bw - gap;
    const r = roundTop ? Math.min(4, h, w / 2) : 0;
    if (!r) return `<rect x="${x}" y="${y1}" width="${w}" height="${h}" fill="${fill}"/>`;
    return `<path d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + w - r} Q${x + w},${y1} ${x + w},${y1 + r} V${y0} Z" fill="${fill}"/>`;
  };
  rows.forEach((r, i) => {
    const x = L + i * bw + gap / 2;
    let acc = 0;
    const last = r.parts.reduce((a, v, j) => (v > 0 ? j : a), -1);
    r.parts.forEach((v, j) => {
      if (!v) return;
      const y0 = y(acc) - (acc > 0 ? 2 : 0);
      acc += v;
      s += bar(x, y0, y(acc), color(keys[j]), j === last);
    });
    if (i % 5 === 4 || i === rows.length - 1) s += `<text class="ax" x="${x + (bw - gap) / 2}" y="${H - 6}" text-anchor="middle">${r.date.slice(5).replace('-', '/')}</text>`;
    s += `<rect class="hit" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}"/>`;
  });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = s;
  const tip = $('#tip');
  svg.querySelectorAll('.hit').forEach((el) => {
    el.onmouseenter = () => {
      const r = rows[+el.dataset.i];
      svg.querySelectorAll('.hov').forEach((n) => n.remove());
      const hv = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      ['x', 'y', 'width', 'height'].forEach((a) => hv.setAttribute(a, el.getAttribute(a)));
      hv.setAttribute('class', 'hov');
      svg.insertBefore(hv, svg.firstChild);
      tip.innerHTML = `<b>${r.date}</b>` + keys.map((k, j) => `<div><span><i style="background:${color(k)}"></i>${esc(k)}</span><span>${fmtB(r.parts[j])}</span></div>`).join('') +
        `<div><span>合计</span><span>${fmtB(r.total)}</span></div>`;
      tip.classList.remove('hidden');
      const bx = +el.getAttribute('x') * (svg.clientWidth / W);
      tip.style.left = Math.min(svg.clientWidth - tip.offsetWidth, Math.max(0, bx - tip.offsetWidth / 2)) + 'px';
      tip.style.top = '-8px';
    };
    el.onmouseleave = () => { tip.classList.add('hidden'); svg.querySelectorAll('.hov').forEach((n) => n.remove()); };
  });
}
window.addEventListener('resize', () => load());
load();
</script>
</body>
</html>
